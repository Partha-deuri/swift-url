<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Swift-url | Home</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <style>
            body { font-family: "Inter", sans-serif; }
            .glass-card { background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(10px); }
        </style>
    </head>

    <body class="bg-[#070707] text-white min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">
        <nav class="flex justify-between items-center py-5 px-6 md:px-12 border-b border-white/10">
            <a href="#" class="flex items-center gap-2 font-bold text-xl tracking-tight hover:text-indigo-400 transition-colors">
                <span class="text-indigo-500">⚡</span> Swift URL
            </a>
            <div class="flex items-center gap-6 text-sm font-semibold text-gray-400">
                <a href="https://github.com/Partha-deuri/swift-url" target="_blank" class="hover:text-white transition-colors">GitHub</a>
            </div>
        </nav>

        <main class="flex-grow flex flex-col items-center justify-center px-4 py-12">
            
            <div class="text-center max-w-3xl mx-auto mb-10">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-indigo-500/30 bg-indigo-500/10 text-indigo-300 text-xs font-semibold mb-6">
                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zM9 5h2v5h-2V5zm0 7h2v2H9v-2z"></path></svg>
                    Easy, Fast & Reliable
                </div>
                <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 leading-tight">
                    Shorten links with <br />
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-emerald-400">Swift Precision</span>
                </h1>
                <p class="text-gray-400 text-lg md:text-xl max-w-xl mx-auto">
                    Tired of long and complex links? Turn them into clean, shareable URLs in seconds.
                </p>
            </div>

            <div class="w-full max-w-2xl glass-card border border-white/10 rounded-2xl p-6 md:p-8 shadow-2xl">
                
                <div class="flex flex-col sm:flex-row gap-3 items-center w-full">
                    <div class="relative w-full">
                        <input
                            id="url-inp"
                            placeholder="Paste your long link here..."
                            type="url"
                            class="w-full bg-[#111] border border-white/10 rounded-xl pl-4 pr-20 py-4 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
                        />
                        <button
                            id="paste-btn"
                            class="absolute right-2 top-1/2 -translate-y-1/2 bg-[#222] hover:bg-[#333] text-gray-300 px-4 py-2 rounded-lg text-sm font-semibold transition-colors"
                        >
                            Paste
                        </button>
                    </div>
                    <button
                        id="lets-go-btn"
                        class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 px-8 rounded-xl transition-all shadow-[0_0_20px_rgba(79,70,229,0.3)] hover:shadow-[0_0_25px_rgba(79,70,229,0.5)] whitespace-nowrap"
                    >
                        Let's Go!
                    </button>
                </div>

                <div id="result-box" class="mt-8 pt-8 border-t border-white/10 hidden">
                    <p class="text-center text-gray-400 font-medium mb-4">Here is your swift URL:</p>
                    
                    <div class="flex flex-col md:flex-row items-center gap-4 bg-[#111] border border-white/10 rounded-xl p-2 pl-4">
                        <div id="short-url-box" class="flex-grow text-emerald-400 font-mono text-sm sm:text-base break-all truncate">
                            {blank}
                        </div>
                        <div class="flex gap-2 w-full md:w-auto mt-3 md:mt-0">
                            <button
                                id="copy-btn"
                                class="flex-1 md:flex-none bg-[#222] hover:bg-[#333] text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition-colors border border-white/5"
                            >
                                Copy
                            </button>
                            <a
                                id="goto-link"
                                class="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-lg text-sm font-semibold text-center transition-colors shadow-[0_0_15px_rgba(5,150,105,0.3)]"
                                target="_blank"
                            >
                                Visit
                            </a>
                        </div>
                    </div>

                    <div class="mt-8 flex flex-col items-center justify-center">
                        <p class="text-xs text-gray-500 font-semibold mb-3 uppercase tracking-wider">Scan QR Code</p>
                        <div class="bg-white p-2 rounded-xl mb-4">
                            <img src="https://quickchart.io/qr?text=something_went_wrong" alt="qr-code" id="qr-code" class="w-32 h-32 rounded-lg" />
                        </div>
                        <button
                            id="download-qr-btn"
                            class="hidden bg-[#222] hover:bg-[#333] text-gray-200 px-4 py-2 rounded-lg text-xs font-semibold transition-colors border border-white/10 flex items-center gap-2"
                        >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                            Download QR Code
                        </button>
                    </div>
                </div>

            </div>

        </main>

        <footer class="py-8 border-t border-white/10 text-center">
            <div class="text-gray-400 font-semibold mb-1">Created by Partha</div>
            <div class="text-xs text-gray-600 mb-2">Only for educational purposes.</div>
            <div class="text-sm font-semibold">
                <a href="https://github.com/Partha-deuri/swift-url" target="_blank" class="text-indigo-400 hover:text-indigo-300 transition-colors">
                    View source code on GitHub ↗
                </a>
            </div>
        </footer>

        <script src="./func.js"></script>
    </body>
</html>
