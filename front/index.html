<!DOCTYPE html>

        <title>Swift-url | 404 Not Found</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <body class="bg-[#070707] text-white min-h-screen flex flex-col">
        <nav class="flex justify-between items-center py-5 px-6 md:px-12 border-b border-white/10">

        <main class="flex-grow flex flex-col items-center justify-center px-4 text-center">

            <h2 class="text-3xl font-bold mb-6 text-gray-200">Link Not Found</h2>
            <p class="text-gray-400 max-w-md mx-auto mb-8">

            </p>
            
            <a href="./home.html" class="bg-[#111] border border-white/10 hover:border-indigo-500 hover:bg-[#1a1a1a] text-white font-semibold py-3 px-8 rounded-xl transition-all shadow-lg inline-flex items-center gap-2">

        <footer class="py-8 border-t border-white/10 text-center">

            <div class="text-sm font-semibold">
